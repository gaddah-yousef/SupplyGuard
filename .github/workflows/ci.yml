name: SupplyGuard CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lancer les tests
        run: python -m pytest -q

  gitleaks:
    name: Détecter les secrets
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer tout l'historique Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Rechercher les secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  semgrep:
    name: Analyser le code avec Semgrep
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Installer Semgrep
        run: python -m pip install semgrep==1.182.0

      - name: Scanner le code et produire le rapport JSON
        run: semgrep scan --config --metrics=off --json --output semgrep-results.json

      - name: Archiver le rapport Semgrep
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supplyguard-semgrep-report
          path: semgrep-results.json
          if-no-files-found: warn
          retention-days: 30

  container-scan:
    name: Scanner l'image Docker
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construire l'image Docker
        run: docker build --tag supplyguard-api:${{ github.sha }} .

      - name: Scanner les dépendances et produire le rapport JSON
        id: trivy_fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-fs-results.json
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.76.1

      - name: Scanner l'image et produire le rapport JSON
        id: trivy_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: supplyguard-api:${{ github.sha }}
          format: json
          output: trivy-image-results.json
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.76.1

      - name: Générer le SBOM CycloneDX
        run: trivy image --format cyclonedx --output supplyguard-sbom.cdx.json supplyguard-api:${{ github.sha }}

      - name: Archiver les rapports Trivy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supplyguard-trivy-reports
          path: |
            trivy-fs-results.json
            trivy-image-results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Archiver le SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supplyguard-sbom
          path: supplyguard-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30

      - name: Bloquer si Trivy signale des vulnérabilités
        if: always()
        env:
          TRIVY_FS_OUTCOME: ${{ steps.trivy_fs.outcome }}
          TRIVY_IMAGE_OUTCOME: ${{ steps.trivy_image.outcome }}
        run: |
          if [[ "$TRIVY_FS_OUTCOME" == "failure" || "$TRIVY_IMAGE_OUTCOME" == "failure" ]]; then
            echo "::error::Trivy a détecté des vulnérabilités HIGH ou CRITICAL corrigibles."
            exit 1
          fi

  publish-image:
    name: Publier l'image sur GHCR
    needs: [tests, gitleaks, semgrep, container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construire l'image
        run: |
          docker build \
            --tag ghcr.io/gaddah-yousef/supplyguard:${{ github.sha }} \
            --tag ghcr.io/gaddah-yousef/supplyguard:latest .

      - name: Scanner l'image avant publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/gaddah-yousef/supplyguard:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.76.1

      - name: Se connecter à GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image
        run: |
          docker push ghcr.io/gaddah-yousef/supplyguard:${{ github.sha }}
          docker push ghcr.io/gaddah-yousef/supplyguard:latest