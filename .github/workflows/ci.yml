name: SupplyGuard CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lancer les tests
        run: python -m pytest -q

  container-scan:
    name: Scanner l'image Docker
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construire l'image Docker
        run: docker build --tag supplyguard-api:${{ github.sha }} .

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: supplyguard-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.76.1

      - name: Générer le SBOM CycloneDX
        run: trivy image --format cyclonedx --output supplyguard-sbom.cdx.json supplyguard-api:${{ github.sha }}

      - name: Archiver le SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supplyguard-sbom
          path: supplyguard-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  publish-image:
    name: Publier l'image sur GHCR
    needs: [tests, container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construire l'image
        run: |
          docker build \
            --tag ghcr.io/gaddah-yousef/supplyguard:${{ github.sha }} \
            --tag ghcr.io/gaddah-yousef/supplyguard:latest .

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/gaddah-yousef/supplyguard:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.76.1

      - name: Se connecter à GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image
        run: |
          docker push ghcr.io/gaddah-yousef/supplyguard:${{ github.sha }}
          docker push ghcr.io/gaddah-yousef/supplyguard:latest